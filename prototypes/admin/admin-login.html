<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | SELINOVA-TECH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
:root {
  --bg: #0a0b0f;
  --bg2: #12141a;
  --bg3: #1a1d26;
  --accent: #00e5ff;
  --accent2: #7c3aed;
  --t1: #f0f2ff;
  --t2: #8892b0;
  --t3: #4a5568;
  --border: #1e2235;
  --red: #ef4444;
  --fh: 'Syne', sans-serif;
  --fm: 'Space Mono', monospace;
  --fb: 'DM Sans', sans-serif;
}
* { box-sizing: border-box; }
body {
  font-family: var(--fb);
  background: var(--bg);
  color: var(--t1);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.login-container {
  width: 100%;
  max-width: 380px;
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 40px 32px;
  box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1);
}
.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 32px;
  justify-content: center;
}
.logo-icon {
  width: 42px; height: 42px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; font-weight: 800;
}
.logo-text {
  font-family: var(--fh);
  font-weight: 800;
  font-size: 1.35rem;
  letter-spacing: -.02em;
}
h1 {
  font-family: var(--fh);
  font-size: 1.65rem;
  font-weight: 700;
  text-align: center;
  margin-bottom: 8px;
}
.subtitle {
  text-align: center;
  color: var(--t2);
  font-size: .9rem;
  margin-bottom: 32px;
}
.form-group {
  margin-bottom: 18px;
}
label {
  display: block;
  font-size: .75rem;
  color: var(--t3);
  margin-bottom: 6px;
  font-family: var(--fm);
  text-transform: uppercase;
  letter-spacing: .5px;
}
input {
  width: 100%;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 13px 16px;
  font-size: .95rem;
  color: var(--t1);
  font-family: var(--fb);
  transition: border-color .2s;
}
input:focus {
  outline: none;
  border-color: var(--accent);
}
.btn {
  width: 100%;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  color: #000;
  border: none;
  border-radius: 10px;
  padding: 14px;
  font-size: .95rem;
  font-weight: 700;
  cursor: pointer;
  margin-top: 8px;
  transition: transform .2s, box-shadow .2s;
}
.btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 10px 15px -3px rgb(0 229 255 / 0.3);
}
.error {
  background: rgba(239, 68, 68, 0.1);
  color: var(--red);
  padding: 10px 14px;
  border-radius: 8px;
  font-size: .85rem;
  margin-top: 12px;
  text-align: center;
  display: none;
}
.hint {
  margin-top: 24px;
  font-size: .75rem;
  color: var(--t3);
  text-align: center;
  font-family: var(--fm);
}
</style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <div class="logo-icon">⬡</div>
      <img src="../../designs/selinova-gate-logo.png" alt="SELINOVA-TECH" style="height: 28px; width: auto;" />
    </div>

    <h1>Admin Login</h1>
    <div class="subtitle">Nur für autorisierte Team-Mitglieder</div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Benutzername</label>
        <input type="text" id="username" placeholder="fero1160?!" required>
      </div>
      <div class="form-group">
        <label for="password">Passwort</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn">Anmelden</button>

      <div id="errorMsg" class="error"></div>
    </form>

    <div class="hint">
      Demo-Zugangsdaten:<br>
      Superadmin (Zugriff verschlüsselt in JS)<br>
      Moderator / Viewer (Beispiele in Dokumentation)<br>
      <small>support@selinova-tech.at · Wien</small>
    </div>
  </div>

<script>
const form = document.getElementById('loginForm');
const errorMsg = document.getElementById('errorMsg');

form.addEventListener('submit', function(e) {
  e.preventDefault();

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  // Encrypted credentials (base64)
  const SUPER_U = atob('ZmVybzExNjA/JSE=');
  const SUPER_P = atob('c2VsaW5hMTkyMzM4');
  if (username === SUPER_U && password === SUPER_P) {
    localStorage.setItem('nexus_admin_auth', 'true');
    window.location.href = 'admin-panel.html';
  } else {
    errorMsg.textContent = 'Falscher Benutzername oder Passwort.';
    errorMsg.style.display = 'block';
    setTimeout(() => {
      errorMsg.style.display = 'none';
    }, 2800);
  }
});

// If already logged in, redirect
if (localStorage.getItem('nexus_admin_auth') === 'true') {
  window.location.href = 'admin-panel.html';
}
</script>
</body>
</html>
