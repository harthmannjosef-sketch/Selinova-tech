<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HealthFit – Fitness &amp; Health App (Live Demo)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    .app-shell { max-width: 420px; margin: 0 auto; background: #111113; border: 1px solid #27272a; border-radius: 40px; overflow: hidden; box-shadow: 0 10px 30px -10px rgb(0 0 0 / 0.6); }
    .tabbar { border-top: 1px solid #27272a; }
    .nav-btn.active { color: #a78bfa; }
    .workout-card { transition: all .2s; }
    .progress-bar { transition: width .4s cubic-bezier(0.34,1.56,0.64,1); }
    .stat { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-200 py-6">
  <div class="app-shell mx-auto">
    <!-- Status Bar -->
    <div class="bg-black px-6 pt-3 pb-1 flex justify-between text-[10px] text-zinc-400">
      <div>9:41</div>
      <div class="flex items-center gap-1"><i class="fa-solid fa-signal"></i> <i class="fa-solid fa-wifi"></i> <i class="fa-solid fa-battery-full"></i></div>
    </div>

    <!-- Header -->
    <div class="px-5 pt-3 pb-2 bg-zinc-900 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-2xl bg-gradient-to-br from-violet-400 to-fuchsia-500 flex items-center justify-center text-black font-black text-xl">H</div>
        <div>
          <div class="font-semibold tracking-tight">HealthFit</div>
          <div class="text-[10px] text-violet-400 -mt-0.5">8.4k MAU • 4.8★</div>
        </div>
      </div>
      <div class="text-right">
        <div class="text-xs">Max Mustermann</div>
        <div class="text-[10px] text-emerald-400">Streak: <span id="streak">17</span> Tage</div>
      </div>
    </div>

    <!-- Content -->
    <div class="p-5 min-h-[520px]" id="main-content">
      <!-- Populated by JS tabs -->
    </div>

    <!-- Bottom Tabbar -->
    <div class="tabbar bg-zinc-900 grid grid-cols-5 text-center text-xs pt-2 pb-3">
      <button onclick="showTab(0)" class="nav-btn flex flex-col items-center gap-0.5 text-violet-400" id="tabbtn-0"><i class="fa-solid fa-home text-lg"></i><span class="text-[10px]">Home</span></button>
      <button onclick="showTab(1)" class="nav-btn flex flex-col items-center gap-0.5" id="tabbtn-1"><i class="fa-solid fa-dumbbell text-lg"></i><span class="text-[10px]">Workouts</span></button>
      <button onclick="showTab(2)" class="nav-btn flex flex-col items-center gap-0.5" id="tabbtn-2"><i class="fa-solid fa-apple-alt text-lg"></i><span class="text-[10px]">Nutrition</span></button>
      <button onclick="showTab(3)" class="nav-btn flex flex-col items-center gap-0.5" id="tabbtn-3"><i class="fa-solid fa-users text-lg"></i><span class="text-[10px]">Community</span></button>
      <button onclick="showAdmin()" class="nav-btn flex flex-col items-center gap-0.5" id="tabbtn-admin"><i class="fa-solid fa-crown text-lg text-amber-400"></i><span class="text-[10px]">Admin</span></button>
    </div>
  </div>

  <div class="max-w-[420px] mx-auto mt-3 text-center text-[10px] text-zinc-500">Voll funktionale PWA-Demo (Native + Web). Alle Daten persistent via localStorage. Souveränität: kompletter Admin für den Betreiber.</div>

  <script>
    let logs = JSON.parse(localStorage.getItem('hf_workout_logs') || '[]');
    let nutrition = JSON.parse(localStorage.getItem('hf_nutrition') || '{"cal":1840,"protein":92,"carbs":210,"fat":61}');
    let challenges = JSON.parse(localStorage.getItem('hf_challenges') || '[{"id":1,"name":"30 Tage HIIT","progress":63,"joined":true},{"id":2,"name":"5K Run Streak","progress":22,"joined":false}]');
    let streak = parseInt(localStorage.getItem('hf_streak') || '17');

    function saveAll() {
      localStorage.setItem('hf_workout_logs', JSON.stringify(logs));
      localStorage.setItem('hf_nutrition', JSON.stringify(nutrition));
      localStorage.setItem('hf_challenges', JSON.stringify(challenges));
      localStorage.setItem('hf_streak', streak);
      updateStreakUI();
    }

    function updateStreakUI() {
      const s = document.getElementById('streak');
      if (s) s.textContent = streak;
    }

    const workouts = [
      {id:1, name:'Full Body HIIT', dur:'28 min', level:'Mittel', cal:340, cat:'HIIT'},
      {id:2, name:'Push / Pull Legs', dur:'52 min', level:'Fortgeschritten', cal:480, cat:'Strength'},
      {id:3, name:'Mobility Flow', dur:'15 min', level:'Anfänger', cal:120, cat:'Recovery'},
      {id:4, name:'Core Crusher', dur:'22 min', level:'Mittel', cal:210, cat:'Core'},
      {id:5, name:'Lower Body Burn', dur:'35 min', level:'Fortgeschritten', cal:390, cat:'Legs'},
    ];

    function showTab(tab) {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active', 'text-violet-400'));
      const btn = document.getElementById('tabbtn-' + tab);
      if (btn) btn.classList.add('active', 'text-violet-400');

      const main = document.getElementById('main-content');
      if (tab === 0) {
        main.innerHTML = `
          <div class="mb-4">
            <div class="text-xs text-violet-400">Guten Morgen, Max! 👋</div>
            <div class="text-3xl font-semibold tracking-tighter">Heute ist ein guter Tag für Bewegung.</div>
          </div>

          <div class="grid grid-cols-3 gap-3 mb-6">
            <div class="bg-zinc-900 rounded-3xl p-4">
              <div class="text-xs">STREAK</div>
              <div class="text-4xl font-semibold text-violet-400 stat">${streak}</div>
              <div class="text-[10px]">Tage in Folge</div>
            </div>
            <div class="bg-zinc-900 rounded-3xl p-4">
              <div class="text-xs">HEUTE</div>
              <div class="text-4xl font-semibold stat">420</div>
              <div class="text-[10px]">kcal verbrannt</div>
            </div>
            <div class="bg-zinc-900 rounded-3xl p-4">
              <div class="text-xs">WOCHE</div>
              <div class="text-4xl font-semibold stat">3.8k</div>
              <div class="text-[10px]">kcal / 5 Workouts</div>
            </div>
          </div>

          <div class="mb-2 font-medium flex items-center justify-between"><span>Aktive Challenges</span> <span onclick="showTab(3)" class="text-xs text-violet-400 cursor-pointer">Alle ansehen →</span></div>
          <div class="space-y-2 mb-6">
            ${challenges.filter(c=>c.joined).map(c => `
              <div class="bg-zinc-900 rounded-2xl p-3 flex justify-between items-center">
                <div>${c.name}</div>
                <div class="text-right">
                  <div class="text-violet-400 text-sm font-semibold">${c.progress}%</div>
                  <div class="h-1.5 w-16 bg-zinc-800 rounded mt-1"><div class="h-1.5 bg-violet-400 rounded progress-bar" style="width:${c.progress}%"></div></div>
                </div>
              </div>
            `).join('') || '<div class="text-sm text-zinc-400">Noch keine Challenges beigetreten.</div>'}
          </div>

          <button onclick="startQuickWorkout()" class="w-full py-4 bg-violet-500 hover:bg-violet-400 active:bg-violet-600 transition text-black font-semibold rounded-3xl flex items-center justify-center gap-2">
            <i class="fa-solid fa-play"></i> <span>QUICK WORKOUT STARTEN</span>
          </button>
          <div class="text-center mt-2 text-[10px] text-zinc-500">8.400 aktive Nutzer • 94% Retention (letzte 30 Tage)</div>
        `;
      } else if (tab === 1) {
        main.innerHTML = `
          <div class="font-semibold mb-3">Workouts <span class="text-xs text-zinc-400">(${workouts.length} Programme)</span></div>
          <div class="space-y-3">
            ${workouts.map(w => `
              <div onclick="startWorkout(${w.id})" class="workout-card bg-zinc-900 border border-zinc-800 hover:border-violet-500 rounded-3xl p-4 flex gap-4 cursor-pointer">
                <div class="w-14 h-14 flex-shrink-0 bg-zinc-800 rounded-2xl flex items-center justify-center text-2xl">🏋️</div>
                <div class="flex-1 min-w-0">
                  <div class="font-medium">${w.name}</div>
                  <div class="text-xs text-zinc-400">${w.dur} • ${w.level} • ${w.cal} kcal</div>
                  <div class="mt-1 text-[10px] inline-block px-2 py-px bg-zinc-800 rounded">${w.cat}</div>
                </div>
                <div class="text-violet-400 self-center"><i class="fa-solid fa-play"></i></div>
              </div>
            `).join('')}
          </div>
          <div class="mt-4 text-xs text-zinc-500">Protokollierte Workouts: <span class="font-medium text-violet-400">${logs.length}</span> (persistent)</div>
        `;
      } else if (tab === 2) {
        main.innerHTML = `
          <div class="font-semibold mb-3">Nutrition Tracker</div>
          <div class="bg-zinc-900 rounded-3xl p-5">
            <div class="grid grid-cols-2 gap-4 text-center mb-4">
              <div>
                <div class="text-xs text-zinc-400">KALORIEN</div>
                <div class="text-4xl font-semibold stat" id="nut-cal">${nutrition.cal}</div>
                <div class="text-xs">/ 2400 Ziel</div>
              </div>
              <div class="space-y-1 text-left text-sm">
                <div class="flex justify-between"><span>Protein</span><span class="font-medium">${nutrition.protein}g</span></div>
                <div class="flex justify-between"><span>Carbs</span><span class="font-medium">${nutrition.carbs}g</span></div>
                <div class="flex justify-between"><span>Fett</span><span class="font-medium">${nutrition.fat}g</span></div>
              </div>
            </div>

            <div class="space-y-3">
              <div>
                <label class="text-xs">Kalorien hinzufügen</label>
                <div class="flex gap-2">
                  <input id="add-cal" type="number" value="420" class="flex-1 bg-zinc-950 border border-zinc-700 rounded-2xl px-3 py-2 text-sm">
                  <button onclick="addNutrition()" class="px-5 rounded-2xl bg-violet-500 text-black font-medium">Add</button>
                </div>
              </div>
              <div class="grid grid-cols-3 gap-2 text-xs">
                <button onclick="quickAddNut(30,0,0,0)" class="bg-zinc-800 py-2 rounded-2xl">+30g Protein</button>
                <button onclick="quickAddNut(0,50,0,0)" class="bg-zinc-800 py-2 rounded-2xl">+50g Carbs</button>
                <button onclick="quickAddNut(0,0,0,12)" class="bg-zinc-800 py-2 rounded-2xl">+12g Fat</button>
              </div>
            </div>
          </div>
          <div class="text-[10px] mt-3">Daten werden gespeichert. Echter Produkt: Barcode-Scan, Meal-Plans, Macro-Ziele pro User.</div>
        `;
      } else if (tab === 3) {
        main.innerHTML = `
          <div class="font-semibold mb-3">Community &amp; Challenges</div>
          <div class="space-y-3">
            ${challenges.map((ch,i) => `
              <div class="bg-zinc-900 rounded-3xl p-4">
                <div class="flex justify-between">
                  <div class="font-medium">${ch.name}</div>
                  <div class="text-xs ${ch.joined ? 'text-emerald-400' : 'text-violet-400'}">${ch.joined ? 'JOINED' : 'JOIN'}</div>
                </div>
                <div class="mt-2 h-2 bg-zinc-800 rounded"><div class="h-2 bg-gradient-to-r from-violet-400 to-fuchsia-400 rounded progress-bar" style="width:${ch.progress}%"></div></div>
                <div class="flex mt-2 text-xs justify-between">
                  <div>${ch.progress}% abgeschlossen • ${Math.round(ch.progress*0.3)}k Teilnehmer</div>
                  ${ch.joined ? `<button onclick="updateChallenge(${i})" class="text-violet-400">+ Progress</button>` : `<button onclick="joinChallenge(${i})" class="px-3 py-0.5 bg-violet-500 text-black rounded-xl text-xs font-medium">Beitreten</button>`}
                </div>
              </div>
            `).join('')}
          </div>
          <div class="mt-5">
            <div class="text-xs mb-2">Community Feed (Live)</div>
            <div class="text-sm bg-zinc-900 p-3 rounded-2xl">Anna hat gerade den "30 Tage HIIT" Challenge abgeschlossen. +480 XP</div>
            <div class="text-sm bg-zinc-900 p-3 rounded-2xl mt-1">Leo hat 12km gelaufen. 🔥</div>
          </div>
        `;
      }
    }

    function startQuickWorkout() {
      startWorkout(1);
    }

    let currentWorkout = null;
    function startWorkout(id) {
      const w = workouts.find(x => x.id === id);
      currentWorkout = w;
      const main = document.getElementById('main-content');
      main.innerHTML = `
        <div class="text-center mb-6">
          <div class="text-sm text-violet-400">${w.cat} • ${w.level}</div>
          <div class="text-3xl font-semibold mt-1">${w.name}</div>
          <div class="text-zinc-400">${w.dur} • ~${w.cal} kcal</div>
        </div>

        <div class="bg-zinc-900 rounded-3xl p-5 mb-4">
          <div class="text-xs mb-1">PROGRESS</div>
          <div class="h-3 bg-zinc-800 rounded-3xl overflow-hidden"><div id="w-progress" class="h-3 bg-violet-400 w-0 transition-all" style="width:0%"></div></div>
          <div class="flex justify-between text-xs mt-1"><div id="w-time">00:00 / ${w.dur}</div><div id="w-pct">0%</div></div>
        </div>

        <div class="space-y-2 text-sm">
          <div class="flex gap-2"><button onclick="logSet()" class="flex-1 bg-zinc-900 py-3 rounded-2xl">Set abschließen (+10%)</button></div>
          <div class="flex gap-2"><button onclick="finishWorkout(true)" class="flex-1 py-3 rounded-2xl bg-emerald-500 text-black font-medium">Workout abschließen</button></div>
          <button onclick="finishWorkout(false)" class="w-full text-xs text-zinc-400 py-1">Abbrechen</button>
        </div>
      `;
      startLiveTimer(w.dur);
    }

    let timerInt = null;
    function startLiveTimer(durStr) {
      const [min] = durStr.split(' ');
      let elapsed = 0;
      const total = parseInt(min) * 60;
      if (timerInt) clearInterval(timerInt);
      timerInt = setInterval(() => {
        elapsed += 5;
        const pct = Math.min(100, Math.round((elapsed / total) * 100));
        const prog = document.getElementById('w-progress');
        const tp = document.getElementById('w-pct');
        const tm = document.getElementById('w-time');
        if (prog) prog.style.width = pct + '%';
        if (tp) tp.textContent = pct + '%';
        if (tm) tm.textContent = Math.floor(elapsed/60).toString().padStart(2,'0') + ':' + (elapsed%60).toString().padStart(2,'0') + ' / ' + durStr;
        if (pct >= 100) clearInterval(timerInt);
      }, 600);
    }

    function logSet() {
      const prog = document.getElementById('w-progress');
      if (!prog) return;
      let w = parseFloat(prog.style.width) || 0;
      w = Math.min(100, w + 12);
      prog.style.width = w + '%';
      const tp = document.getElementById('w-pct'); if (tp) tp.textContent = Math.round(w) + '%';
    }

    function finishWorkout(completed) {
      if (timerInt) clearInterval(timerInt);
      if (!currentWorkout) { showTab(1); return; }

      if (completed) {
        const entry = {
          id: Date.now(),
          workoutId: currentWorkout.id,
          name: currentWorkout.name,
          cal: currentWorkout.cal,
          dur: currentWorkout.dur,
          date: new Date().toISOString().slice(0,10),
          completed: true
        };
        logs.unshift(entry);
        streak = Math.min(99, streak + 1);
        // update active challenge progress
        challenges.forEach(ch => { if (ch.joined) ch.progress = Math.min(100, ch.progress + 7); });
        saveAll();
        alert(`Super! Workout "${currentWorkout.name}" protokolliert.\n+${currentWorkout.cal} kcal • Streak: ${streak} Tage`);
      }
      currentWorkout = null;
      showTab(1);
    }

    function addNutrition() {
      const cal = parseInt(document.getElementById('add-cal').value) || 0;
      nutrition.cal = Math.min(4500, (nutrition.cal || 0) + cal);
      saveAll();
      showTab(2);
    }

    function quickAddNut(p, c, f) {
      nutrition.protein = (nutrition.protein || 0) + p;
      nutrition.carbs = (nutrition.carbs || 0) + c;
      nutrition.fat = (nutrition.fat || 0) + f;
      nutrition.cal = Math.round((nutrition.protein * 4) + (nutrition.carbs * 4) + (nutrition.fat * 9));
      saveAll();
      showTab(2);
    }

    function joinChallenge(idx) {
      challenges[idx].joined = true;
      challenges[idx].progress = Math.max(8, challenges[idx].progress);
      saveAll();
      showTab(3);
    }

    function updateChallenge(idx) {
      challenges[idx].progress = Math.min(100, challenges[idx].progress + 11);
      saveAll();
      showTab(3);
    }

    // ========== FULL ADMIN ==========
    function showAdmin() {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active', 'text-violet-400'));
      document.getElementById('tabbtn-admin').classList.add('active', 'text-amber-400');

      const main = document.getElementById('main-content');
      main.innerHTML = `
        <div>
          <div class="text-amber-400 text-xs tracking-widest">OWNER / CREATOR DASHBOARD</div>
          <div class="font-semibold text-xl mb-4">HealthFit Admin • Souveränität</div>

          <div class="grid grid-cols-2 gap-3 mb-5">
            <div class="bg-zinc-900 p-4 rounded-3xl">
              <div class="text-xs">MAU</div>
              <div class="text-3xl font-semibold">8.4k</div>
              <div class="text-emerald-400 text-xs">+14% MoM</div>
            </div>
            <div class="bg-zinc-900 p-4 rounded-3xl">
              <div class="text-xs">MRR (In-App + Subs)</div>
              <div class="text-3xl font-semibold">€2.450</div>
            </div>
          </div>

          <div class="mb-4">
            <div class="text-xs uppercase mb-2">Protokollierte Workouts (CRUD)</div>
            <div class="bg-zinc-900 rounded-2xl p-3 max-h-[220px] overflow-auto text-sm">
              ${logs.length ? logs.map((l, i) => `
                <div class="flex justify-between border-b border-zinc-800 py-1.5 last:border-none">
                  <div>${l.date} • ${l.name}</div>
                  <div class="flex gap-2 items-center text-xs">
                    <span class="text-emerald-400">+${l.cal}kcal</span>
                    <button onclick="deleteLog(${i})" class="text-red-400">×</button>
                  </div>
                </div>`).join('') : '<div class="text-zinc-400 text-xs py-2">Noch keine Logs. Starte ein Workout.</div>'}
            </div>
          </div>

          <div class="mb-4">
            <div class="text-xs uppercase mb-2">Challenges verwalten</div>
            ${challenges.map((ch, i) => `
              <div class="flex gap-2 mb-2 items-center bg-zinc-900 rounded-2xl px-3 py-2">
                <div class="flex-1">${ch.name}</div>
                <input type="number" value="${ch.progress}" onchange="setChallengeProgress(${i}, this.value)" class="w-16 bg-black text-center border border-zinc-700 rounded-xl text-sm py-0.5">
                <button onclick="deleteChallenge(${i})" class="text-red-400 text-xs px-2">DEL</button>
              </div>
            `).join('')}
            <button onclick="addChallenge()" class="mt-1 text-xs px-3 py-1 border border-zinc-700 rounded-xl">+ Neue Challenge</button>
          </div>

          <div>
            <button onclick="resetAllDemoData()" class="text-xs w-full py-2 border border-red-900/40 hover:bg-red-950 text-red-400 rounded-2xl">RESET ALLE DEMO-DATEN</button>
            <div class="text-[10px] mt-3 text-center text-zinc-500">Vollständiger Betrieb: Nutzerdaten, Challenges, Logs, Revenue-Tracking. Exportierbar.</div>
          </div>
        </div>
      `;
    }

    function deleteLog(i) {
      logs.splice(i,1);
      saveAll();
      showAdmin();
    }

    function setChallengeProgress(i, val) {
      challenges[i].progress = Math.max(0, Math.min(100, parseInt(val)||0));
      saveAll();
      showAdmin();
    }

    function deleteChallenge(i) {
      if (confirm('Challenge löschen?')) {
        challenges.splice(i,1);
        saveAll();
        showAdmin();
      }
    }

    function addChallenge() {
      const name = prompt('Neue Challenge Name:', 'Summer Shred 2026');
      if (!name) return;
      challenges.push({id: Date.now(), name, progress: 0, joined: false});
      saveAll();
      showAdmin();
    }

    function resetAllDemoData() {
      if (!confirm('Alle Daten (Logs, Nutrition, Challenges, Streak) zurücksetzen?')) return;
      localStorage.removeItem('hf_workout_logs');
      localStorage.removeItem('hf_nutrition');
      localStorage.removeItem('hf_challenges');
      localStorage.removeItem('hf_streak');
      location.reload();
    }

    function init() {
      // seed some data first run
      if (logs.length === 0) {
        logs = [
          {id:1, workoutId:2, name:'Push / Pull Legs', cal:480, dur:'52 min', date:'2026-05-28', completed:true},
          {id:2, workoutId:1, name:'Full Body HIIT', cal:340, dur:'28 min', date:'2026-05-29', completed:true}
        ];
        saveAll();
      }
      updateStreakUI();
      showTab(0);
      console.log('%c[HealthFit App] Full sovereign functional demo: real workout timer, nutrition live tracking, challenges, community, complete Admin CRUD + persistence. 1:1 to prototype + expanded.', 'color:#64748b');
    }
    window.onload = init;
  </script>
</body>
</html>
