<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LearnSphere – E-Learning Plattform (Live Demo)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-zinc-950 text-zinc-200">
  <nav class="bg-zinc-900 border-b border-zinc-800">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3"><div class="w-8 h-8 bg-violet-500 rounded-xl flex items-center justify-center text-black font-bold">LS</div><div class="font-semibold">LearnSphere</div></div>
      <div class="flex gap-4 text-sm">
        <button onclick="showCourses()" class="hover:text-violet-400">Kurse</button>
        <button onclick="showMyLearning()" class="hover:text-violet-400">Mein Lernen</button>
        <button onclick="showCreator()" class="px-3 py-1 bg-violet-500 text-black rounded-xl text-xs font-medium">Creator Admin</button>
      </div>
      <div class="text-xs">3.800 Lernende • 62 Kurse • 4.8★</div>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto p-6">
    <div id="content"></div>
  </div>

  <script>
    let enrollments = JSON.parse(localStorage.getItem('ls_enroll') || '[]');
    let progress = JSON.parse(localStorage.getItem('ls_progress') || '{}');
    let courses = JSON.parse(localStorage.getItem('ls_courses') || 'null') || [
      {id:1, title:'KI für Einsteiger', instructor:'Dr. Müller', price:49, duration:'8 Std', level:'Anfänger', img:'🤖', lessons:12, students:1240},
      {id:2, title:'Full-Stack Webdev mit Next.js', instructor:'Anna K.', price:89, duration:'24 Std', level:'Fortgeschritten', img:'💻', lessons:32, students:890},
      {id:3, title:'Design Systems & Figma Mastery', instructor:'Studio M', price:65, duration:'11 Std', level:'Mittel', img:'🎨', lessons:19, students:610},
      {id:4, title:'Data Science mit Python', instructor:'Prof. Lang', price:79, duration:'18 Std', level:'Fortgeschritten', img:'📊', lessons:27, students:540}
    ];

    function save() {
      localStorage.setItem('ls_enroll', JSON.stringify(enrollments));
      localStorage.setItem('ls_progress', JSON.stringify(progress));
      localStorage.setItem('ls_courses', JSON.stringify(courses));
    }

    function showCourses() {
      const c = document.getElementById('content');
      c.innerHTML = `
        <h1 class="text-3xl font-semibold mb-1">Entdecke Kurse</h1>
        <p class="text-zinc-400 mb-6">62 Kurse • Zertifikate • Lifetime Access • Stripe Checkout</p>
        <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
          ${courses.map(co => `
            <div onclick="showCourseDetail(${co.id})" class="bg-zinc-900 border border-zinc-800 rounded-3xl p-5 cursor-pointer hover:border-violet-500">
              <div class="text-5xl mb-4">${co.img}</div>
              <div class="font-semibold">${co.title}</div>
              <div class="text-xs text-zinc-400">${co.instructor} • ${co.duration} • ${co.level}</div>
              <div class="mt-4 flex items-center justify-between">
                <div><span class="text-xl font-semibold">€${co.price}</span></div>
                <div class="text-xs px-2 py-1 bg-zinc-800 rounded">${co.lessons} Lektionen</div>
              </div>
              <div class="text-[10px] mt-1 text-zinc-500">${co.students} Lernende</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function showCourseDetail(id) {
      const co = courses.find(x => x.id === id);
      const enrolled = enrollments.includes(id);
      const prog = progress[id] || 0;
      const c = document.getElementById('content');
      c.innerHTML = `
        <button onclick="showCourses()" class="text-violet-400 mb-3">← Alle Kurse</button>
        <div class="grid lg:grid-cols-3 gap-8">
          <div class="lg:col-span-2">
            <div class="text-5xl mb-2">${co.img}</div>
            <h1 class="text-3xl font-semibold">${co.title}</h1>
            <div class="text-zinc-400">${co.instructor} • ${co.duration} • ${co.level} • ${co.lessons} Lektionen</div>

            <div class="mt-6 bg-zinc-900 border border-zinc-800 rounded-3xl p-5">
              <div class="font-medium mb-2">Was du lernst</div>
              <ul class="text-sm space-y-1 text-zinc-300">
                <li>✓ Grundlagen &amp; fortgeschrittene Konzepte</li>
                <li>✓ Praktische Projekte &amp; Code-Repos</li>
                <li>✓ Quizzes + Abschlusszertifikat</li>
                <li>✓ Community &amp; Q&amp;A Lifetime</li>
              </ul>
            </div>

            ${enrolled ? `
              <div class="mt-4">
                <div class="flex justify-between text-xs mb-1"><span>Dein Fortschritt</span><span>${prog}%</span></div>
                <div class="h-2 bg-zinc-800 rounded"><div class="h-2 bg-violet-400 rounded" style="width:${prog}%"></div></div>
                <button onclick="startLesson(${id})" class="mt-3 w-full py-3 bg-violet-500 text-black font-semibold rounded-2xl">Weiter lernen / Video starten</button>
              </div>
            ` : `
              <button onclick="enroll(${id})" class="mt-4 w-full py-3 bg-violet-500 hover:bg-violet-400 text-black font-semibold rounded-2xl">Jetzt für €${co.price} einschreiben</button>
            `}
          </div>

          <div>
            <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-5 text-sm">
              <div>Inklusive:</div>
              <div class="mt-2 space-y-1 text-xs">• HD Videos &amp; Downloads<br>• Quizzes mit Zertifikat<br>• Quellcode &amp; Assets<br>• Slack-Community Zugang<br>• 30 Tage Geld-zurück</div>
            </div>
            ${enrolled ? `<button onclick="completeCourse(${id})" class="mt-3 text-xs w-full py-2 border border-emerald-700 text-emerald-400 rounded-2xl">Kurs als abgeschlossen markieren + Zertifikat</button>` : ''}
          </div>
        </div>
      `;
    }

    function enroll(id) {
      if (!enrollments.includes(id)) {
        enrollments.push(id);
        progress[id] = 12;
        save();
      }
      alert('Eingeschrieben! Zahlung simuliert (Stripe). Du kannst jetzt loslegen.');
      showCourseDetail(id);
    }

    function startLesson(courseId) {
      const c = document.getElementById('content');
      c.innerHTML = `
        <button onclick="showCourseDetail(${courseId})" class="mb-3 text-violet-400">← Zurück zum Kurs</button>
        <div class="max-w-3xl">
          <div class="aspect-video bg-black rounded-3xl flex items-center justify-center mb-4">
            <div class="text-center">
              <i class="fa-solid fa-play text-5xl text-violet-400"></i>
              <div class="mt-3 text-sm">Video Lektion 3/12 – "Prompt Engineering Basics" (Demo)</div>
            </div>
          </div>
          <div class="flex gap-3">
            <button onclick="completeLesson(${courseId})" class="flex-1 py-3 bg-emerald-500 text-black font-medium rounded-2xl">Lektion abschließen (+15%)</button>
            <button onclick="takeQuiz(${courseId})" class="flex-1 py-3 border border-zinc-700 rounded-2xl">Quiz starten</button>
          </div>
        </div>
      `;
    }

    function completeLesson(courseId) {
      progress[courseId] = Math.min(100, (progress[courseId]||0) + 15);
      save();
      alert('Lektion abgeschlossen. Fortschritt gespeichert.');
      showCourseDetail(courseId);
    }

    function takeQuiz(courseId) {
      const score = prompt('Quiz Demo: Wie viele % hast du erreicht? (0-100)', '87');
      const s = parseInt(score)||80;
      progress[courseId] = Math.max(progress[courseId]||0, Math.min(100, s));
      save();
      alert(`Quiz abgeschlossen mit ${s}%. Zertifikat verfügbar bei 100%.`);
      showCourseDetail(courseId);
    }

    function completeCourse(id) {
      progress[id] = 100;
      save();
      const co = courses.find(x=>x.id===id);
      alert(`Herzlichen Glückwunsch!\n\nZertifikat für "${co.title}" wurde generiert und in dein Profil gelegt.\n\n(Demo: PDF-Zertifikat mit Signatur + Verifizierungslink)`);
      showMyLearning();
    }

    function showMyLearning() {
      const c = document.getElementById('content');
      const my = courses.filter(co => enrollments.includes(co.id));
      c.innerHTML = `
        <h2 class="text-2xl font-semibold mb-4">Mein Lernen</h2>
        ${my.length === 0 ? '<div class="text-zinc-400">Noch nicht eingeschrieben. Entdecke Kurse oben.</div>' : `
          <div class="space-y-3">
            ${my.map(co => {
              const p = progress[co.id] || 0;
              return `
                <div onclick="showCourseDetail(${co.id})" class="bg-zinc-900 border border-zinc-800 p-4 rounded-3xl flex justify-between cursor-pointer">
                  <div>
                    <div class="font-medium">${co.title}</div>
                    <div class="text-xs text-zinc-400">${co.instructor}</div>
                  </div>
                  <div class="text-right">
                    <div class="text-violet-400">${p}%</div>
                    <div class="text-[10px]">${p===100 ? 'Zertifikat verfügbar' : 'Weiter lernen'}</div>
                  </div>
                </div>`;
            }).join('')}
          </div>
        `}
      `;
    }

    // CREATOR ADMIN (Sovereignty)
    function showCreator() {
      const c = document.getElementById('content');
      c.innerHTML = `
        <div class="text-xs text-violet-400">CREATOR DASHBOARD • FULL CONTROL</div>
        <div class="text-2xl font-semibold mb-5">Kurse &amp; Umsatz verwalten</div>

        <div class="grid lg:grid-cols-2 gap-6">
          <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-5">
            <div class="flex justify-between mb-3"><span class="font-medium">Deine Kurse</span><button onclick="creatorAddCourse()" class="text-xs px-3 py-1 bg-violet-500 text-black rounded">+ Kurs</button></div>
            ${courses.map(co => `
              <div class="flex justify-between py-2 border-t border-zinc-800 text-sm">
                <div>${co.title}</div>
                <div class="flex gap-3 text-xs">
                  <span>€${co.price}</span>
                  <button onclick="creatorEditCourse(${co.id})" class="text-violet-400">Edit</button>
                  <button onclick="creatorDeleteCourse(${co.id})" class="text-red-400">Del</button>
                </div>
              </div>
            `).join('')}
          </div>

          <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-5">
            <div class="font-medium mb-3">Revenue &amp; Enrollments</div>
            <div class="text-3xl font-semibold">€${(courses.reduce((s,co) => s + co.price * (co.students||300), 0)/12).toFixed(0)} <span class="text-xs font-normal">MRR</span></div>
            <div class="text-xs mt-4">3.800 aktive Lernende • 94% Completion Rate (Demo)</div>
            <button onclick="exportCertificates()" class="mt-4 text-xs w-full border border-zinc-700 py-2 rounded-2xl">Zertifikate als CSV exportieren</button>
          </div>
        </div>
      `;
    }

    function creatorAddCourse() {
      const title = prompt('Kurs Titel:', 'Neuer Kurs 2026');
      if (!title) return;
      const price = parseInt(prompt('Preis €:', '59')) || 59;
      const newC = {id:Date.now(), title, instructor:'Du', price, duration:'10 Std', level:'Mittel', img:'📚', lessons:15, students:12};
      courses.push(newC);
      save();
      showCreator();
    }

    function creatorEditCourse(id) {
      const co = courses.find(x=>x.id===id);
      co.title = prompt('Titel:', co.title) || co.title;
      co.price = parseInt(prompt('Preis:', co.price)) || co.price;
      save();
      showCreator();
    }

    function creatorDeleteCourse(id) {
      if (confirm('Kurs löschen?')) {
        courses = courses.filter(x=>x.id!==id);
        enrollments = enrollments.filter(x=>x!==id);
        save();
        showCreator();
      }
    }

    function exportCertificates() {
      alert('CSV mit allen Zertifikaten (Demo) wurde heruntergeladen. Echter Produkt: PDF-Generierung + Verifizierungs-Links.');
    }

    function init() {
      // seed a couple enrollments
      if (enrollments.length === 0) {
        enrollments = [1,3];
        progress[1] = 67;
        progress[3] = 34;
        save();
      }
      showCourses();
      console.log('%c[LearnSphere E-Learning] Full platform: course catalog, enrollment, video/quiz sim, progress, certificates, complete Creator Admin (CRUD + revenue). Sovereign.', 'color:#64748b');
    }
    window.onload = init;
  </script>
</body>
</html>
