<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeadGen DACH – B2B Plattform (Live Demo)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="bg-zinc-950 text-zinc-200">
  <nav class="bg-zinc-900 border-b border-zinc-800">
    <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="font-semibold">LeadGen DACH <span class="text-xs text-emerald-400">1.200 Firmen • 4.200 Abos</span></div>
      <div class="flex gap-4 text-sm">
        <button onclick="showLeads()">Leads suchen</button>
        <button onclick="showNewsletter()">Newsletter</button>
        <button onclick="showAdmin()" class="px-4 py-1.5 bg-emerald-500 text-black rounded-2xl text-sm font-medium">CRM Admin</button>
      </div>
    </div>
  </nav>

  <div class="max-w-7xl mx-auto p-6">
    <div id="content"></div>
  </div>

  <script>
    let leads = JSON.parse(localStorage.getItem('b2b_leads') || 'null') || [
      {id:1, company:'Muster GmbH', industry:'Manufacturing', region:'DE', employees:240, contact:'Max M.', status:'new'},
      {id:2, company:'TechFlow AG', industry:'Software', region:'AT', employees:85, contact:'Lisa K.', status:'contacted'},
      {id:3, company:'SwissParts SA', industry:'Automotive', region:'CH', employees:410, contact:'Peter S.', status:'qualified'},
    ];
    let subs = JSON.parse(localStorage.getItem('b2b_subs') || '4200');

    function save() {
      localStorage.setItem('b2b_leads', JSON.stringify(leads));
      localStorage.setItem('b2b_subs', subs);
    }

    function showLeads() {
      const c = document.getElementById('content');
      c.innerHTML = `
        <div class="mb-4 flex justify-between">
          <div class="text-2xl font-semibold">B2B Lead-Suche (DACH)</div>
          <button onclick="addLead()" class="text-xs px-3 py-1 bg-emerald-500 text-black rounded">+ Lead manuell</button>
        </div>
        <div class="bg-zinc-900 border border-zinc-800 rounded-3xl overflow-hidden">
          <table class="w-full text-sm">
            <thead class="bg-zinc-950 text-xs text-zinc-400"><tr>
              <th class="p-4 text-left">Firma</th><th>Branche</th><th>Region</th><th>Mitarbeiter</th><th>Kontakt</th><th>Status</th><th></th>
            </tr></thead>
            <tbody>
              ${leads.map((l,i) => `
                <tr class="border-t border-zinc-800">
                  <td class="p-4 font-medium">${l.company}</td>
                  <td>${l.industry}</td>
                  <td>${l.region}</td>
                  <td>${l.employees}</td>
                  <td>${l.contact}</td>
                  <td>
                    <select onchange="updateStatus(${i},this.value)" class="bg-zinc-950 text-xs border border-zinc-700 rounded px-1">
                      <option value="new" ${l.status==='new'?'selected':''}>neu</option>
                      <option value="contacted" ${l.status==='contacted'?'selected':''}>kontaktiert</option>
                      <option value="qualified" ${l.status==='qualified'?'selected':''}>qualifiziert</option>
                      <option value="closed" ${l.status==='closed'?'selected':''}>abgeschlossen</option>
                    </select>
                  </td>
                  <td><button onclick="deleteLead(${i})" class="text-red-400 text-xs">löschen</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
        <div class="mt-2 text-xs text-zinc-500">CRM-Sync mit HubSpot (Demo). 1.200 registrierte Firmen.</div>
      `;
    }

    function updateStatus(i, status) {
      leads[i].status = status;
      save();
    }

    function addLead() {
      const company = prompt('Firmenname:', 'Neue GmbH');
      if (!company) return;
      leads.unshift({id:Date.now(), company, industry:'Sonstige', region:'DE', employees:50, contact:'Unbekannt', status:'new'});
      save();
      showLeads();
    }

    function deleteLead(i) {
      if (confirm('Lead löschen?')) {
        leads.splice(i,1);
        save();
        showLeads();
      }
    }

    function showNewsletter() {
      const c = document.getElementById('content');
      c.innerHTML = `
        <div class="text-2xl font-semibold mb-4">Automatisierter Newsletter (4.200 Abos)</div>
        <div class="bg-zinc-900 border border-zinc-800 p-5 rounded-3xl max-w-md">
          <div class="text-sm">Nächste Kampagne: <span class="font-semibold">Q2 B2B Trends DACH</span></div>
          <button onclick="sendCampaign()" class="mt-4 w-full py-3 bg-emerald-500 text-black font-semibold rounded-2xl">Kampagne jetzt senden (Demo)</button>
          <div class="text-xs mt-2 text-zinc-400">Öffnungsrate 34% • CTR 8.2% (Demo)</div>
        </div>
      `;
    }

    function sendCampaign() {
      alert('Newsletter-Kampagne versendet! +120 neue Leads simuliert.');
      subs = parseInt(subs) + 120;
      leads.unshift({id:Date.now(), company:'Auto-Lead aus Kampagne', industry:'Software', region:'DE', employees:30, contact:'Newsletter', status:'new'});
      save();
      showLeads();
    }

    function showAdmin() {
      const c = document.getElementById('content');
      c.innerHTML = `
        <div class="text-emerald-400 text-xs">B2B PLATFORM OWNER • FULL SOVEREIGNTY</div>
        <div class="text-2xl font-semibold mb-5">LeadGen DACH Admin</div>

        <div class="grid md:grid-cols-3 gap-4">
          <div class="bg-zinc-900 border border-zinc-800 p-5 rounded-3xl">
            <div class="text-xs">Gesamt Leads</div>
            <div class="text-4xl font-semibold">${leads.length}</div>
          </div>
          <div class="bg-zinc-900 border border-zinc-800 p-5 rounded-3xl">
            <div class="text-xs">Newsletter Abos</div>
            <div class="text-4xl font-semibold">${subs}</div>
          </div>
          <div class="bg-zinc-900 border border-zinc-800 p-5 rounded-3xl">
            <div class="text-xs">MRR (Subs + Leads)</div>
            <div class="text-4xl font-semibold">€6.400</div>
          </div>
        </div>

        <div class="mt-4 text-xs text-zinc-500">HubSpot Sync • Automatische Kampagnen • Export für Salesforce. Der Käufer erhält den kompletten Betrieb.</div>
      `;
    }

    function init() {
      showLeads();
      console.log('%c[B2B LeadGen DACH] Full sovereign platform: advanced lead search, CRM status workflow, newsletter automation, complete Admin. 1:1 + expanded.', 'color:#166534');
    }
    window.onload = init;
  </script>
</body>
</html>
